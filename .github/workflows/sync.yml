name: Sync from Airtable and publish

on:
  schedule:
    - cron: "17 9 * * *"   # every day around 5 a.m. Eastern
  workflow_dispatch:        # "Run workflow" button for an immediate update
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull latest laws from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: node scripts/sync.mjs
      - name: Save the update to the repo
        run: |
          if ! git diff --quiet data/laws.json; then
            git config user.name "tracker-sync"
            git config user.email "tracker-sync@users.noreply.github.com"
            git add data/laws.json
            git commit -m "Sync laws from Airtable"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
